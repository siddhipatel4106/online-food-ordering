<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuickBite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <form class="auth-form" id="loginForm">
            <h2>Login to QuickBite</h2>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-block">Login</button>
            
            <p style="text-align: center; margin-top: 20px; color: #7f8c8d;">
                Don't have an account? <a href="register.html">Register here</a>
            </p>

            <div id="message" style="margin-top: 15px;"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const messageDiv = document.getElementById('message');
    
            try {
                const response = await fetch('php/login_user.php', {
                    method: 'POST',
                    body: formData
                });
    
                const data = await response.json();
                
                if (data.success) {
                    messageDiv.innerHTML = '<div style="color: green; text-align: center;">Login successful! Redirecting...</div>';
                    
                    // Store user info in localStorage
                    localStorage.setItem('userLoggedIn', 'true');
                    localStorage.setItem('userName', data.user_name);
                    localStorage.setItem('userId', data.user_id);
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    messageDiv.innerHTML = `<div style="color: red; text-align: center;">${data.message}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = '<div style="color: red; text-align: center;">Error occurred. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
