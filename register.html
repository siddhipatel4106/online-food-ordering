<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - QuickBite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <form class="auth-form" id="registerForm">
            <h2>Create Account</h2>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" required>
            </div>
            
            <button type="submit" class="btn btn-block">Register</button>
            
            <p style="text-align: center; margin-top: 20px; color: #7f8c8d;">
                Already have an account? <a href="login.html">Login here</a>
            </p>

            <div id="message" style="margin-top: 15px;"></div>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('php/register_user.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.success) {
                    messageDiv.innerHTML = '<div style="color: green; text-align: center;">Registration successful! Redirecting to login...</div>';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    messageDiv.innerHTML = `<div style="color: red; text-align: center;">${data.message}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = '<div style="color: red; text-align: center;">Error occurred. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
